[tool.ruff]
# Comprimento da linha (padrão moderno)
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Habilita Pyflakes (F), pycodestyle (E, W), isort (I), pep8-naming (N)
select = ["E", "F", "W", "I", "N"]
# E501 (comprimento) fica a cargo do formatter; E701/E731 são escolhas de estilo
# usadas de forma consistente no código (statements compostos e atalhos com lambda).
ignore = ["E501", "E701", "E731"]

[tool.ruff.lint.per-file-ignores]
# Propriedades de settings usam UPPER_CASE para espelhar as chaves de ambiente.
"app/app/settings_dynamic.py" = ["N802", "N803"]
"app/app/config/settings_properties.py" = ["N802", "N803"]
"app/app/db_manager.py" = ["N802", "N806"]
# Notação matemática (NSGA/bandits): nomes de variáveis/args em maiúsculas.
"app/app/nsga_meta_optimizer.py" = ["N802", "N803", "N806", "E402"]
"app/app/nsga_weights_updater.py" = ["N806"]
"app/app/bandits.py" = ["N806"]
# Módulos legados de compatibilidade (nome iniciando com dígito) e re-exports por *.
"app/app/00providers.py" = ["N999", "F401", "F403", "F405"]
"app/app/00rag.py" = ["N999", "F401", "F403", "F405"]
# Pacote de configuração reexporta símbolos via import *.
"app/app/config/__init__.py" = ["F401", "F403", "F405"]
# Stubs de teste com propriedades UPPER_CASE que espelham settings.
"tests/*" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
# Módulos legados de compatibilidade (nome iniciando com dígito) não são type-checked.
exclude = ['app/app/00.*\.py$']
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false # Permite funções sem tipagem (para não quebrar código legado agora)
check_untyped_defs = true

# Configurações específicas para bibliotecas sem tipagem
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "chromadb.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services or credentials",
    "slow: long-running tests",
]
