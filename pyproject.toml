[tool.ruff]
# Comprimento da linha (padrão moderno)
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Habilita Pyflakes (F), pycodestyle (E, W), isort (I), pep8-naming (N)
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"] # Ignora erro de linha muito longa (deixa o formatter cuidar)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false # Permite funções sem tipagem (para não quebrar código legado agora)
check_untyped_defs = true

# Configurações específicas para bibliotecas sem tipagem
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "chromadb.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services or credentials",
    "slow: long-running tests",
]
