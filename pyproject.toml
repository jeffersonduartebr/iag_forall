[tool.ruff]
# Comprimento da linha (padrão moderno)
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Habilita Pyflakes (F), pycodestyle (E, W), isort (I), pep8-naming (N)
select = ["E", "F", "W", "I", "N", "C901"]
# E501 (comprimento) fica a cargo do formatter; E701/E731 são escolhas de estilo
# usadas de forma consistente no código (statements compostos e atalhos com lambda).
ignore = ["E501", "E701", "E731"]

[tool.ruff.lint.mccabe]
# Portão de complexidade ciclomática: CC < 15, ou seja nenhuma função acima de 14.
# Entra no CRAP como CC² · (1 − cov)³ + CC, por isso cada ramo a mais custa ao
# quadrado em risco e obriga a mais cobertura para o compensar (scripts/crap_report.py).
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# Propriedades de settings usam UPPER_CASE para espelhar as chaves de ambiente.
"app/app/settings_dynamic.py" = ["N802", "N803"]
"app/app/config/settings_properties.py" = ["N802", "N803"]
"app/app/db_manager.py" = ["N802", "N806"]
# Notação matemática (NSGA/bandits): nomes de variáveis/args em maiúsculas.
"app/app/nsga_meta_optimizer.py" = ["N802", "N803", "N806", "E402"]
"app/app/nsga_weights_updater.py" = ["N806"]
"app/app/bandits.py" = ["N806"]
# Pacote de configuração reexporta símbolos via import *.
"app/app/config/__init__.py" = ["F401", "F403", "F405"]
# Stubs de teste com propriedades UPPER_CASE que espelham settings.
"tests/*" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mutmut]
# Teste de mutação dos núcleos numéricos (recompensa, rubrica, políticas de bandit,
# preços, estratégia de roteamento). Rodar com `scripts/run_mutation.sh` (monta um
# workspace com o pacote em src/app: o mutmut só reconhece o prefixo "src." ao
# derivar o nome do módulo, e os testes importam "app.*"). Lento: na CI roda só por
# workflow_dispatch/agendamento. Meta: escore de mutação >= 80%.
source_paths = ["src/app"]
only_mutate = [
    "src/app/services/reward.py",
    "src/app/services/judge_rubric.py",
    "src/app/services/bandit_policy.py",
    "src/app/utils/pricing.py",
    "src/app/router_strategy.py",
]
also_copy = ["pytest.ini"]
# Mensagens de log não são comportamento: mutá-las só gera mutantes equivalentes.
do_not_mutate_patterns = ["logger\\.(debug|info|warning|error|exception)\\("]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_reward_weights.py",
    "tests/test_properties_scoring.py",
    "tests/test_properties_routing.py",
    "tests/test_judge_rubric.py",
    "tests/test_judge_rubric_exact.py",
    "tests/test_bandit_policy.py",
    "tests/test_reward_pricing_exact.py",
    "tests/test_router_strategy_exact.py",
    "tests/test_pricing_extra.py",
    "tests/test_local_cost.py",
    "tests/test_bandits.py",
    "tests/test_bandits_more.py",
    "tests/test_router_strategy.py",
    "tests/test_router_strategy_extra.py",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false # Permite funções sem tipagem (para não quebrar código legado agora)
check_untyped_defs = true

# Configurações específicas para bibliotecas sem tipagem
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "chromadb.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services or credentials",
    "slow: long-running tests",
]
