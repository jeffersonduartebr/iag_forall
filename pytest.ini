[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    integration: tests that require external services or credentials
    slow: long-running tests
    benchmark: hot-path performance benchmarks (pytest-benchmark; measured only with --benchmark-enable)
    contract: OpenAPI contract fuzzing (schemathesis); excluded by default, run with -m contract
addopts = --benchmark-disable -m "not contract"
