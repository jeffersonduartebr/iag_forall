# ================================================================
# Alembic Configuration File
# Projeto: Router LLM Multimodal + Meta-Bandit + RAG
# ================================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Desabilita pooling interno do Alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

# O env.py irá sobrescrever sqlalchemy.url dinamicamente usando o settings_dynamic


# ================================================================
# Logging
# ================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
