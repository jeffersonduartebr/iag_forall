groups:
  - name: llm_router_alerts
    rules:
      - alert: ApiDown
        expr: up{job="llm_router_api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API router indisponível"
          description: "O target llm_router_api não responde há 2 minutos."

      - alert: HighErrorRate
        expr: rate(api_requests_total[5m]) > 0 and rate(router_query_outcome_total{outcome!="success"}[5m]) / rate(api_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro elevada na API"

      - alert: CircuitBreakerOpen
        expr: component_health{component="circuit_breakers"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker aberto"

      - alert: QueryJobBacklog
        expr: query_job_queue_size > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fila de jobs assíncronos elevada"

      # Sinais da carga do Caso 1 (2026-09-24): prazos estourados e respostas vazias precediam os 502/504.
      - alert: SyncDeadlineExceeded
        expr: sum(rate(router_sync_deadline_exceeded_total[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pedidos estourando o prazo síncrono (ver vazão por modelo em tps:<modelo> no Redis)"

      - alert: EmptyAnswers
        expr: sum by (model) (rate(router_response_empty_total[15m])) > 0.005
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Modelo {{ $labels.model }} devolvendo respostas vazias (cota de raciocínio?)"

      # Execução em sombra: o orçamento diário esgotou antes das 18h no fuso SHADOW_BUDGET_TZ (a amostra da tarde
      # fica cortada; a probabilidade de inclusão passa a depender do horário).
      - alert: ShadowBudgetExhaustedEarly
        expr: max(aristo_shadow_budget_exhausted_hour) >= 0 and max(aristo_shadow_budget_exhausted_hour) < 18
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Orçamento diário da sombra esgotado antes das 18h ({{ $value }}h)"
