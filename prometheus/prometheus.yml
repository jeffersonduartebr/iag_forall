# ============================================================
# Prometheus — LLM Router Stack
# ============================================================

global:
  scrape_interval: 30s
  scrape_timeout: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: llm-router-stack

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: llm_router_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: llm_router_api
          env: production

  - job_name: nsga_updater
    metrics_path: /metrics
    static_configs:
      - targets: ["nsga_weights_updater:9999"]
        labels:
          service: nsga_updater
          env: production

  - job_name: prometheus
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          env: internal
