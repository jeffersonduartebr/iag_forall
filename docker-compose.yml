services:
  # =========================================================
  # ⚙️ Inicialização do banco e Redis (migração automática)
  # =========================================================
  db_init:
    build: ./app
    container_name: db_initializer
    dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "app/db_manager.py"]
    restart: "no"
    env_file:
      - .env
    networks:
      - ai_net

  # =========================================================
  # 🌐 API principal de roteamento de LLMs
  # =========================================================
  api:
    build: ./app
    container_name: llm_router_api
    restart: unless-stopped
    dockerfile: Dockerfile
    depends_on:
      db_init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      prometheus:
        condition: service_started
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PATH=/data/chroma
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom/api
      - CHROMA_TELEMETRY_ENABLED=false
    volumes:
      - ./state:/app/state
      - ./data:/app/data
      - ./chromadb-data:/data/chroma
      - ./tmp_prom/api:/tmp/prom/api
    ports:
      - "8000:8000"
    command: >
      bash -c "echo '🧩 Esperando Redis e Banco...'; sleep 5;
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    networks:
      - ai_net

  # =========================================================
  # 🧠 Serviço NSGA-II (otimização multiobjetivo)
  # =========================================================
  nsga_updater:
    build:
      context: .
      dockerfile: app/Dockerfile.nsga
    container_name: nsga_weights_updater
    depends_on:
      db_init:
        condition: service_completed_successfully
    ports:
      - "9999:9999"
    environment:
      - DB_HOST=mariadb
      - DB_USER=router_user
      - DB_PASS=router_pass
      - DB_NAME=routerdb
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom/nsga_updater
    volumes:
      - ./tmp_prom/nsga_updater:/tmp/prom/nsga_updater
    restart: unless-stopped
    networks:
      - ai_net

  # =========================================================
  # 🧩 Servidor Ollama (modelos locais)
  # =========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=600
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_METRICS=true
      - GOOGLE_APPLICATION_CREDENTIALS=/app/keys/vertex_api.json.json  
    volumes:
      - ./ollama_data:/root/.ollama
      - ./app/data/vertex_api.json:/app/keys/vertex_api.json.json:ro
    gpus: all
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  # =========================================================
  # 📈 Prometheus
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_tmp:/tmp/prom
    networks:
      - ai_net

  # =========================================================
  # 📊 Grafana
  # =========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ai_net

  # =========================================================
  # 🪵 Loki e Promtail
  # =========================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml
    networks:
      - ai_net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ai_net

  # =========================================================
  # 🧪 Locust (testes de carga)
  # =========================================================
  locust:
    image: locustio/locust:latest
    container_name: locust
    restart: unless-stopped
    depends_on:
      - api
      - ollama
    environment:
      - LOCUST_MODE=standalone
    volumes:
      - ./tests:/mnt/locust:rw
    working_dir: /mnt/locust
    command: -f /mnt/locust/locustfile.py --web-host 0.0.0.0
    ports:
      - "8089:8089"
    networks:
      - ai_net

  # =========================================================
  # 🧩 Redis — cache / fila
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "SenhaForte"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai_net

  # =========================================================
  # 🗄️ Banco de dados MariaDB
  # =========================================================
  mariadb:
    image: mariadb:11
    container_name: mariadb_router
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: routerdb
      MYSQL_USER: router_user
      MYSQL_PASSWORD: router_pass
    volumes:
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s
    networks:
      - ai_net

  # =========================================================
  # 🎛 Painel Dash de Controle
  # =========================================================
  dash-control:
    build: .
    dockerfile: Dockerfile
    command: python app/dash_control_panel.py
    ports:
      - "8050:8050"
    depends_on:
      db_init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
      - DB_HOST=mariadb
      - DB_USER=router_user
      - DB_PASS=router_pass
      - DB_NAME=routerdb
    networks:
      - ai_net

# =========================================================
# 📦 Volumes persistentes
# =========================================================
volumes:
  ollama_data:
  chroma_data:
  bandit_state:
  redis-data:
  mariadb_data:

# =========================================================
# 🌐 Rede
# =========================================================
networks:
  ai_net:
    driver: bridge
