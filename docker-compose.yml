services:
  api:
    build: ./app
    container_name: llm_router_api
    restart: unless-stopped
    depends_on:
      - ollama
      - chromadb
      - prometheus
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - COMMERCIAL_MODEL_1=${COMMERCIAL_MODEL_1}
      - COMMERCIAL_MODEL_2=${COMMERCIAL_MODEL_2}
      - BANDIT_STATE_PATH=${BANDIT_STATE_PATH}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
      - ENABLE_RAG_FOR_JUDGES=${ENABLE_RAG_FOR_JUDGES}
      - CHROMADB_HOST=${CHROMADB_HOST}
      - CHROMADB_PORT=${CHROMADB_PORT}
      - JUDGES_MODE=${JUDGES_MODE}
      - JUDGE_LLM_MODEL=${JUDGE_LLM_MODEL}
      - JUDGE_LLM_N=${JUDGE_LLM_N}
      - JUDGE_USE_RAG=${JUDGE_USE_RAG}
    volumes:
      - ./state:/app/state
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - ai_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      ollama serve &
      echo 'Aguardando o Ollama iniciar...';
      for i in {1..60}; do
        sleep 2;
        ollama list >/dev/null 2>&1 && break;
        echo '... ainda iniciando';
      done;
      ollama pull phi4 deepseek-r1:8b || true;
      wait
      "
    networks:
      - ai_net
      

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./chromadb-data:/data
    networks:
      - ai_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ai_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ai_net

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml
    networks:
      - ai_net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ai_net

  locust:
    image: locustio/locust:latest
    container_name: locust
    restart: unless-stopped
    depends_on:
      - api
      - ollama
    environment:
      - LOCUST_MODE=standalone
    # monte a PASTA inteira (mais confiável no Windows)
    volumes:
      - ./tests:/mnt/locust:rw
    working_dir: /mnt/locust
    # force o arquivo explicitamente
    command: -f /mnt/locust/locustfile.py --web-host 0.0.0.0
    ports:
      - "8089:8089"
    networks:
      - ai_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "SenhaForte"]
    restart: unless-stopped
    ports:
      - "6379:6379"        # opcional: exponha só se precisar acessar fora do compose
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    depends_on: [redis]
    environment:
      - CELERY_BROKER_URL=redis://:SenhaForte@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:SenhaForte@redis:6379/1


volumes:
  ollama_data:
  chroma_data:
  bandit_state:
  redis-data:

networks:
  ai_net:
    driver: bridge