name: CI

on:
  push:
  pull_request:

jobs:
  lint_typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Ruff
        run: PYTHONPATH=app ruff check app/app tests

      - name: Mypy
        run: PYTHONPATH=app mypy app/app

  tests_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Pytest (unit/default markers + coverage)
        run: |
          PYTHONPATH=app pytest -q tests --cov=app/app --cov-report=term-missing --cov-fail-under=70
